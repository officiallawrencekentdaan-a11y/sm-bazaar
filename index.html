<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM Bazaar</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/7ZrZ3vf1/CP_Logo_PNG.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Announcement banner - thinner */
        .announcement {
            background-color: #1a73e8;
            color: white;
            text-align: center;
            padding: 0.3rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* Main Navigation - thinner */
        .main-nav {
            background-color: white;
            padding: 0.5rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .site-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #3c4043;
        }

        .site-title img {
            height: 1.5rem;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-size: 1rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #3c4043;
            padding-bottom: 2px;
            border-bottom: 2px solid transparent;
            transition: border-color 0.1s;
            cursor: pointer;
        }

        .nav-links a.active {
            border-bottom-color: #1a73e8;
            color: #1a73e8;
        }

        .nav-links a:hover {
            border-bottom-color: #dadce0;
        }

        /* Content area (fills remaining space, no margins) */
        .content-area {
            flex: 1;
            position: relative;
            /* No margins or borders – full width/height */
        }

        /* Welcome section (visible by default) – full coverage */
        .welcome {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://i.postimg.cc/JnWYkVfy/percision-blog-header-junk-food-102323.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            text-align: center;
            padding: 2.5rem 2rem;  /* inner spacing for text, not outer */
            isolation: isolate;
            overflow: auto;
            /* No border, no radius – seamless */
        }

        /* Dark overlay for welcome text */
        .welcome::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .welcome h1 {
            font-size: 2.8rem;
            font-weight: 400;
            margin-bottom: 2rem;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .bazaar-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
        }

        .card {
            flex: 1 1 250px;
            max-width: 320px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(2px);
            border-radius: 1rem;
            padding: 2rem 1rem;
            text-decoration: none;
            color: #202124;
            border: 1px solid #e8eaed;
            transition: box-shadow 0.15s, border-color 0.15s, background-color 0.15s;
            cursor: pointer;
        }

        .card:hover {
            border-color: #1a73e8;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: rgba(255, 255, 255, 0.95);
        }

        .card h2 {
            font-size: 1.8rem;
            font-weight: 450;
            margin-bottom: 0.5rem;
            color: #1a73e8;
        }

        .card p {
            color: #5f6368;
            font-size: 0.95rem;
        }

        /* Iframe container (hidden by default) – full coverage */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none; /* hidden by default */
            background: white;
            /* No border, no radius – seamless */
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: block;
        }

        /* Mobile adjustments – keep margins only for nav, but content area remains full */
        @media (max-width: 700px) {
            .main-nav {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            .main-nav {
                flex-direction: column;
                align-items: start;
                gap: 0.75rem;
            }
            .nav-links {
                flex-wrap: wrap;
                gap: 1rem;
            }
            .welcome h1 {
                font-size: 2rem;
            }
            /* Keep welcome padding smaller on mobile */
            .welcome {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Announcement banner -->
    <div class="announcement">
        🎉 SM Bazaar is now open! Special offers this weekend only.
    </div>

    <!-- Main navigation with logo -->
    <div class="main-nav">
        <div class="site-title">
            <img src="https://i.postimg.cc/7ZrZ3vf1/CP_Logo_PNG.png" alt="CP Logo">
            SM BAZAAR
        </div>
        <div class="nav-links">
            <a id="nav-home" class="active">Home</a>
            <a id="nav-baybay">SM Baybay Bazaar</a>
            <a id="nav-cebu">SM Cebu Bazaar</a>
        </div>
    </div>

    <!-- Content area that holds either welcome or iframe (now edge-to-edge) -->
    <div class="content-area">
        <!-- Welcome section (visible by default) -->
        <main id="welcome-section" class="welcome">
            <h1>WELCOME TO SM BAZAAR</h1>
            <div class="bazaar-cards">
                <div id="card-baybay" class="card">
                    <h2>SM Baybay Bazaar</h2>
                    <p>Explore the Baybay market</p>
                </div>
                <div id="card-cebu" class="card">
                    <h2>SM Cebu Bazaar</h2>
                    <p>Discover Cebu's finest</p>
                </div>
            </div>
        </main>

        <!-- Iframe container for embedded pages (hidden initially) -->
        <div id="iframe-container" class="iframe-container">
            <!-- iframe with normal scrolling (so content can scroll inside) -->
            <iframe id="content-iframe" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        (function() {
            // URLs for the two bazaars (Google Apps Script web apps)
            const baybayUrl = "https://script.google.com/a/macros/outdoorequipped.com/s/AKfycbx3f9uOLXaGEPfzbcwRHF0LwFV8hBi6oD32Dttls31NvZmonBmPuyYo0KEK5fMVqaOC/exec";
            const cebuUrl = "https://script.google.com/a/macros/outdoorequipped.com/s/AKfycbxFH_c4aD4ePIuvsqrC4CA12Gm09kFPDfCMZXsYJjf1HlzwxKObg-WosUKOk3AbEYBo/exec";

            // DOM elements
            const navHome = document.getElementById('nav-home');
            const navBaybay = document.getElementById('nav-baybay');
            const navCebu = document.getElementById('nav-cebu');
            const cardBaybay = document.getElementById('card-baybay');
            const cardCebu = document.getElementById('card-cebu');
            const welcomeSection = document.getElementById('welcome-section');
            const iframeContainer = document.getElementById('iframe-container');
            const contentIframe = document.getElementById('content-iframe');
            const navLinks = [navHome, navBaybay, navCebu];

            // Helper to show welcome and hide iframe
            function showWelcome() {
                welcomeSection.style.display = 'block';
                iframeContainer.style.display = 'none';
                // Update active nav
                navLinks.forEach(link => link.classList.remove('active'));
                navHome.classList.add('active');
            }

            // Helper to load a URL in iframe, hide welcome, show iframe
            function loadUrl(url, activeLink) {
                contentIframe.src = url;
                welcomeSection.style.display = 'none';
                iframeContainer.style.display = 'block';
                // Update active nav
                navLinks.forEach(link => link.classList.remove('active'));
                activeLink.classList.add('active');
            }

            // Event listeners for navigation
            navHome.addEventListener('click', function(e) {
                e.preventDefault();
                showWelcome();
            });

            navBaybay.addEventListener('click', function(e) {
                e.preventDefault();
                loadUrl(baybayUrl, navBaybay);
            });

            navCebu.addEventListener('click', function(e) {
                e.preventDefault();
                loadUrl(cebuUrl, navCebu);
            });

            // Event listeners for cards
            cardBaybay.addEventListener('click', function(e) {
                e.preventDefault();
                loadUrl(baybayUrl, navBaybay);
            });

            cardCebu.addEventListener('click', function(e) {
                e.preventDefault();
                loadUrl(cebuUrl, navCebu);
            });
        })();
    </script>
</body>
</html>
