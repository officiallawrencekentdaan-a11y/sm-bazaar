<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM Bazaar</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/7ZrZ3vf1/CP_Logo_PNG.png">
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Announcement banner - thinner */
        .announcement {
            background-color: #1a73e8;
            color: white;
            text-align: center;
            padding: 0.3rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* Main Navigation - thinner */
        .main-nav {
            background-color: white;
            padding: 0.5rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .site-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #3c4043;
        }

        .site-title img {
            height: 1.5rem;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-size: 1rem;
            font-weight: 500;
        }

        .nav-links a {
            text-decoration: none;
            color: #3c4043;
            padding-bottom: 2px;
            border-bottom: 2px solid transparent;
            transition: border-color 0.1s;
            cursor: pointer;
        }

        .nav-links a.active {
            border-bottom-color: #1a73e8;
            color: #1a73e8;
        }

        .nav-links a:hover {
            border-bottom-color: #dadce0;
        }

        /* Content area (fills remaining space, no margins) */
        .content-area {
            flex: 1;
            position: relative;
        }

        /* Welcome section – full coverage with dark overlay */
        .welcome {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://i.postimg.cc/JnWYkVfy/percision-blog-header-junk-food-102323.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Dark overlay for the background image */
        .welcome::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
        }

        /* Welcome card – transparent with white border */
        .welcome-card {
            background: transparent;
            border-radius: 1.5rem;
            padding: 3rem 4rem;
            border: 2px solid white;
            text-align: center;
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(2px); /* subtle blur for extra elegance */
        }

        .welcome-card h1 {
            font-size: 4rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .welcome-card h1 span {
            display: block;
            font-size: 2.5rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Bazaar cards container */
        .bazaar-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin-top: 2.5rem;
        }

        .card {
            flex: 1 1 220px;
            max-width: 260px;
            background: white;
            border-radius: 2rem;
            padding: 2rem 1rem;
            text-decoration: none;
            color: #202124;
            border: 1px solid #eaeef2;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.03);
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: #1a73e8;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1a73e8;
        }

        .card p {
            color: #5f6368;
            font-size: 1rem;
            font-weight: 400;
        }

        /* Iframe container (hidden by default) – full coverage */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            background: white;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: block;
        }

        /* Mobile adjustments */
        @media (max-width: 700px) {
            .main-nav {
                padding-left: 1rem;
                padding-right: 1rem;
                flex-direction: column;
                align-items: start;
                gap: 0.75rem;
            }
            .nav-links {
                flex-wrap: wrap;
                gap: 1rem;
            }
            .welcome-card {
                padding: 2rem 1.5rem;
            }
            .welcome-card h1 {
                font-size: 2.5rem;
            }
            .welcome-card h1 span {
                font-size: 1.8rem;
            }
            .bazaar-cards {
                gap: 1rem;
            }
            .card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Announcement banner -->
    <div class="announcement">
        🎉 SM Bazaar is now open! Special offers this weekend only. 😉
    </div>

    <!-- Main navigation with logo -->
    <div class="main-nav">
        <div class="site-title">
            <img src="https://i.postimg.cc/7ZrZ3vf1/CP_Logo_PNG.png" alt="CP Logo">
            SM BAZAAR
        </div>
        <div class="nav-links">
            <a id="nav-home" class="active">Home</a>
            <a id="nav-baybay">Baybay Bazaar</a>
            <a id="nav-cebu">Cebu Bazaar</a>
        </div>
    </div>

    <!-- Content area that holds either welcome or iframe (edge-to-edge) -->
    <div class="content-area">
        <!-- Welcome section (visible by default) -->
        <main id="welcome-section" class="welcome">
            <div class="welcome-card">
                <h1>
                    WELCOME TO<br>
                    <span>SM BAZAAR</span>
                </h1>
                <div class="bazaar-cards">
                    <div id="card-baybay" class="card">
                        <h2>SM Baybay</h2>
                        <p>We have your favorites</p>
                    </div>
                    <div id="card-cebu" class="card">
                        <h2>SM Cebu</h2>
                        <p>Discover Cebu's finest</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Iframe container for embedded pages (hidden initially) -->
        <div id="iframe-container" class="iframe-container">
            <iframe id="content-iframe" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        (function() {
            // URLs for the two bazaars (Google Apps Script web apps)
            const baybayUrl = "https://script.google.com/a/macros/outdoorequipped.com/s/AKfycbx3f9uOLXaGEPfzbcwRHF0LwFV8hBi6oD32Dttls31NvZmonBmPuyYo0KEK5fMVqaOC/exec";
            const cebuUrl = "https://script.google.com/a/macros/outdoorequipped.com/s/AKfycbxFH_c4aD4ePIuvsqrC4CA12Gm09kFPDfCMZXsYJjf1HlzwxKObg-WosUKOk3AbEYBo/exec";

            // DOM elements
            const navHome = document.getElementById('nav-home');
            const navBaybay = document.getElementById('nav-baybay');
            const navCebu = document.getElementById('nav-cebu');
            const cardBaybay = document.getElementById('card-baybay');
            const cardCebu = document.getElementById('card-cebu');
            const welcomeSection = document.getElementById('welcome-section');
            const iframeContainer = document.getElementById('iframe-container');
            const contentIframe = document.getElementById('content-iframe');
            const navLinks = [navHome, navBaybay, navCebu];

            // Helper to show welcome and hide iframe
            function showWelcome() {
                welcomeSection.style.display = 'flex';
                iframeContainer.style.display = 'none';
                navLinks.forEach(link => link.classList.remove('active'));
                navHome.classList.add('active');
            }

            // Helper to load a URL in iframe, hide welcome, show iframe
            function loadUrl(url, activeLink) {
                contentIframe.src = url;
                welcomeSection.style.display = 'none';
                iframeContainer.style.display = 'block';
                navLinks.forEach(link => link.classList.remove('active'));
                activeLink.classList.add('active');
            }

            // Event listeners for navigation
            navHome.addEventListener('click', (e) => {
                e.preventDefault();
                showWelcome();
            });

            navBaybay.addEventListener('click', (e) => {
                e.preventDefault();
                loadUrl(baybayUrl, navBaybay);
            });

            navCebu.addEventListener('click', (e) => {
                e.preventDefault();
                loadUrl(cebuUrl, navCebu);
            });

            // Event listeners for cards
            cardBaybay.addEventListener('click', (e) => {
                e.preventDefault();
                loadUrl(baybayUrl, navBaybay);
            });

            cardCebu.addEventListener('click', (e) => {
                e.preventDefault();
                loadUrl(cebuUrl, navCebu);
            });
        })();
    </script>
</body>
</html>
